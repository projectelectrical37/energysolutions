<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตั้งค่า Emission Factor</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
            font-family: sans-serif;
        }
        .settings-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 360px;
        }
        h2 { text-align: center; margin-bottom: 8px; }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        label { font-size: 14px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-save:hover { background: #1976D2; }
        .btn-back {
            width: 100%;
            padding: 10px;
            background: #eee;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-back:hover { background: #ddd; }
        .success {
            color: green;
            text-align: center;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="settings-box">
        <h2>⚙️ ตั้งค่าระบบ</h2>
        <p class="subtitle">สำหรับ Admin เท่านั้น</p>

        <label for="efInput">Emission Factor (kgCO₂/kWh)</label>
        <input 
            type="number" 
            id="efInput" 
            step="0.001" 
            min="0" 
            placeholder="เช่น 0.475"
        >

        <button class="btn-save" onclick="saveSettings()">💾 บันทึก</button>
        <button class="btn-back" onclick="goBack()">← กลับหน้าหลัก</button>
        <p class="success" id="successMsg">✅ บันทึกค่าเรียบร้อยแล้ว</p>
    </div>

    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        // ✅ โหลดค่าจาก Worker
        window.addEventListener('load', async () => {
            const res = await fetch('https://emission-api.projectelectrical37.workers.dev/');
            const data = await res.json();
            document.getElementById('efInput').value = data.value;
        });

        // ✅ บันทึกค่าไป Worker
        async function saveSettings() {
            const val = document.getElementById('efInput').value;
            if (!val || isNaN(val)) {
                alert('กรุณากรอกค่าให้ถูกต้อง');
                return;
            }

            const response = await fetch('https://emission-api.projectelectrical37.workers.dev/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: val })
            });

            const result = await response.json();
            if (result.success) {
                document.getElementById('successMsg').style.display = 'block';
                setTimeout(() => {
                    sessionStorage.removeItem('isAdmin');
                    window.location.href = 'more_carbon.html';
                }, 1000);
            }
        }

        function goBack() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'more_carbon.html';
        }
    </script>
</body>
</html>
